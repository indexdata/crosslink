components:
  parameters:
    Offset:
      name: offset
      in: query
      description: Offset for pagination (first item is 0)
      schema:
        type: integer
        format: int32
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Limit for pagination
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
        default: 10
    entryLookupKey:
      name: key
      in: path
      description: Key to look up entry, either 'id' or 'symbol'
      required: true
      schema:
        type: string
        enum: [by-id, by-symbol]
    entryLookupValue:
      name: value
      in: path
      description: Value of id or symbol to access entry by
      required: true
      schema:
        type: string

  schemas:
    ConflictPolicy:
      type: string
      enum: [fail, skip, update]
      default: fail

    AddEntry:
      type: object
      x-go-type: Entry
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/EntryType'
        parent:
          type: string
          format: uuid
        description:
          type: string
        organizationId:
          type: string
        contactName:
          type: string
        email:
          type: string
        fromEmail:
          type: string
        tenant:
          type: string
          description: Tenant that owns the entry; only consortial administrators may set this field.
        vendor:
          $ref: '#/components/schemas/EntryVendor'
        phoneNumber:
          type: string
        lmsLocationCode:
          type: string
        illConfig:
          $ref: '#/components/schemas/AddEntryIllConfig'
        hrid:
          type: string
        timeZone:
          type: string
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/AddEntrySymbol'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddEntryAddress'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/AddEntryClosure'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/AddEntryServiceEndpoint'
        lmsConfig:
          description: Configuration for LMS (Library Management System) integration via NCIP protocol
          allOf:
            - $ref: '#/components/schemas/LmsConfig'
        catalogConfig:
          $ref: '#/components/schemas/CatalogConfig'
        holdingsPolicy:
          description: Policy that determines whether and in which order holdings may supply an item.
          allOf:
            - $ref: '#/components/schemas/HoldingsPolicy'

    AddEntrySymbol:
      type: object
      additionalProperties: false
      x-go-type: Symbol
      required:
        - symbol
        - authority
      properties:
        symbol:
          type: string
          minLength: 1
          description: Uppercase string
        authority:
          type: string
          minLength: 1
          description: Uppercase string

    AddEntryServiceEndpoint:
      type: object
      additionalProperties: false
      x-go-type: ServiceEndpoint
      required:
        - name
        - type
        - address
      properties:
        name:
          type: string
        type:
          type: string
        address:
          type: string

    AddEntryAddress:
      x-go-type: Address
      allOf:
        - $ref: '#/components/schemas/AddressProperties'

    CreateClosure:
      type: object
      additionalProperties: false
      x-go-type: Closure
      required:
        - entry
        - startDate
        - endDate
        - reason
      properties:
        entry:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: ISO8601 date
        endDate:
          type: string
          format: date
          description: ISO8601 date
        reason:
          type: string

    AddEntryClosure:
      type: object
      additionalProperties: false
      x-go-type: Closure
      required:
        - startDate
        - endDate
        - reason
      properties:
        startDate:
          type: string
          format: date
          description: ISO8601 date
        endDate:
          type: string
          format: date
          description: ISO8601 date
        reason:
          type: string

    AddEntryIllConfig:
      type: object
      x-go-type: IllConfig
      properties:
        defaultLoanPeriod:
          type: [integer, "null"]
          format: int32
          minimum: 1
          description: Default supplier loan period in calendar days. Omitted or null disables the fallback.
        iso18626Url:
          type: string
          description: URL of the ISO18626 service. When set, used instead of an ISO18626 service from endpoints.
        iso18626Vendor:
          description: ISO18626 service vendor. Used only when iso18626Url is non-empty.
          allOf:
            - $ref: '#/components/schemas/EntryVendor'
        lendersOfLastResort:
          type: array
          description: Suppliers appended to the end of the rota when no regular supplier can fill the request. Each normalized authority and symbol pair must be unique and exist in the directory; authorities must not contain colons.
          items:
            $ref: '#/components/schemas/AddEntrySymbol'
        includeRequestingAgencyInfo:
          type: boolean
          description: Whether outgoing requests include requestingAgencyInfo populated from the requester directory entry.
        includeSupplierInfo:
          type: boolean
          description: Whether outgoing requests include supplierInfo populated from the supplier directory entry.
        includeReturnInfo:
          type: boolean
          description: Whether Loaned messages include returnInfo populated from the supplier directory entry.
        includeVendorNote:
          type: boolean
          description: Whether broker-generated supplying-agency messages include the supplier vendor in the note.
        useOfferedCosts:
          type: boolean
          description: Whether deliveryCosts are transferred to offeredCosts for messages sent to this requester.
        noteFieldSeparator:
          type: string
          description: Separator used between fields added to notes in messages sent to this entry.
        supplierPatronPattern:
          type: string
          description: Format pattern used to create a patron ID for requests received by this supplier.
        duplicateCheckWindowHours:
          type: integer
          format: int32
          description: The number of hours to check for duplicate requests. If a request is submitted within this window, it will be considered a duplicate.
          minimum: 0

    AddTier:
      type: object
      x-go-type: Tier
      required:
        - consortium
        - name
        - level
        - type
        - cost
      properties:
        consortium:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        level:
          $ref: '#/components/schemas/TierLevel'
        type:
          $ref: '#/components/schemas/TierType'
        cost:
          type: number
          format: double
          default: 0.0

    AddNetwork:
      type: object
      x-go-type: Network
      required:
        - consortium
        - name
      properties:
        consortium:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        reciprocal:
          type: boolean

    CreateEntryTier:
      type: object
      x-go-type: EntryTier
      required:
        - entry
        - tier
      properties:
        entry:
          type: string
          format: uuid
          description: ID of entry
        tier:
          type: string
          format: uuid
          description: ID of tier

    EntryType:
      type: string
      enum: [Institution, Consortium, Branch]
      x-enum-varnames: [EntryTypeInstitution, EntryTypeConsortium, EntryTypeBranch]

    TierPatch:
      type: object
      additionalProperties: false
      properties:
        level:
          $ref: '#/components/schemas/TierLevel'
        type:
          $ref: '#/components/schemas/TierType'
        cost:
          type: number
          format: double

    TierLevel:
      type: string
      enum: [express, normal, rush, secondarymail, standard, urgent]
      default: standard

    TierType:
      type: string
      enum: [loan, copy]
      default: loan

    QueryConfigType:
      type: string
      enum: [cql, pqf]
      x-enum-varnames: [QueryConfigTypeCql, QueryConfigTypePqf]

    HostLmsVendor:
      type: string
      enum: [Alma, Sierra, Koha, WMS, Aleph, FOLIO, Generic]
      x-go-type: string

    BibIdNormalization:
      type: string
      enum: [none, sierra]
      x-go-type: string

    AddressType:
      type: string
      enum: [Default, Shipping, Billing, Other]

    AddressComponentType:
      type: string
      enum: [Thoroughfare, Locality, AdministrativeArea, PostalCode, CountryCode, Other]

    MarcAvailabilityOperator:
      type: string
      enum: [equals, absent]
      x-go-type: string

    OpacAvailabilityRule:
      type: string
      enum: [availableNow, publicNote]
      x-go-type: string

    ShelvingLocationSource:
      type: string
      enum: [shelvingLocation, localLocation]
      x-go-type: string

    ImportItemType:
      type: string
      enum: [entry, tier, network]

    ImportSectionResult:
      type: object
      additionalProperties: false
      required: [imported, failed, skipped]
      properties:
        imported: { type: integer, format: int32 }
        failed: { type: integer, format: int32 }
        skipped: { type: integer, format: int32 }

    ImportItemError:
      type: object
      additionalProperties: false
      required: [line, error]
      properties:
        line: { type: integer, format: int32 }
        type:
          $ref: '#/components/schemas/ImportItemType'
        key: { type: string }
        error: { type: string }

    ImportResult:
      type: object
      additionalProperties: false
      required: [entries, tiers, networks, errors, errorsOmitted]
      properties:
        entries: { $ref: '#/components/schemas/ImportSectionResult' }
        tiers: { $ref: '#/components/schemas/ImportSectionResult' }
        networks: { $ref: '#/components/schemas/ImportSectionResult' }
        errors:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ImportItemError' }
        errorsOmitted:
          type: integer
          format: int32
          minimum: 0
          description: Number of additional error details omitted from the response.

    ImportNetworkAssignment:
      type: object
      additionalProperties: false
      required: [authority, symbol, priority]
      properties:
        authority: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        priority: { type: integer, format: int32 }

    ImportTierKey:
      type: object
      additionalProperties: false
      required: [consortium, name]
      properties:
        consortium: { $ref: '#/components/schemas/SymbolProperties' }
        name: { type: string, minLength: 1 }

    ImportNetworkKey:
      type: object
      additionalProperties: false
      required: [consortium, name]
      properties:
        consortium: { $ref: '#/components/schemas/SymbolProperties' }
        name: { type: string, minLength: 1 }

    ImportAddress:
      type: object
      additionalProperties: false
      required: [type, addressComponents]
      properties:
        type:
          $ref: '#/components/schemas/AddressType'
        addressComponents:
          type: array
          items: { $ref: '#/components/schemas/AddressComponent' }

    ImportLmsConfig:
      type: object
      additionalProperties: false
      required: [vendor, ncipNamespaceEnabled, bibIdNormalization, address, fromAgency, fromAgencyAuthentication, toAgency, lookupUserEnabled, acceptItemEnabled, checkInItemEnabled, checkOutItemEnabled, itemLocation, requestItemRequestType, requestItemRequestScopeType, requestItemBibIdCode, requestItemEnabled, requestItemPickupLocationEnabled, requesterPickupLocation, supplierPickupLocation, requesterPatronPattern, patronProfiles]
      properties:
        vendor:
          anyOf: [{ $ref: '#/components/schemas/HostLmsVendor' }, { type: "null" }]
        ncipNamespaceEnabled: { type: [boolean, "null"] }
        bibIdNormalization:
          anyOf: [{ $ref: '#/components/schemas/BibIdNormalization' }, { type: "null" }]
        address: { type: string }
        fromAgency: { type: string }
        fromAgencyAuthentication: { type: [string, "null"] }
        toAgency: { type: [string, "null"] }
        lookupUserEnabled: { type: [boolean, "null"] }
        acceptItemEnabled: { type: [boolean, "null"] }
        checkInItemEnabled: { type: [boolean, "null"] }
        checkOutItemEnabled: { type: [boolean, "null"] }
        itemLocation: { type: [string, "null"] }
        requestItemRequestType: { type: [string, "null"] }
        requestItemRequestScopeType: { type: [string, "null"] }
        requestItemBibIdCode: { type: [string, "null"] }
        requestItemEnabled: { type: [boolean, "null"] }
        requestItemPickupLocationEnabled: { type: [boolean, "null"] }
        requesterPickupLocation: { type: [string, "null"] }
        supplierPickupLocation: { type: [string, "null"] }
        requesterPatronPattern: { type: [string, "null"] }
        patronProfiles:
          anyOf: [{ $ref: '#/components/schemas/PatronProfiles' }, { type: "null" }]
    ImportIllConfig:
      type: object
      additionalProperties: false
      required: [iso18626Url, iso18626Vendor, lendersOfLastResort, includeRequestingAgencyInfo, includeSupplierInfo, includeReturnInfo, includeVendorNote, useOfferedCosts, noteFieldSeparator, supplierPatronPattern, duplicateCheckWindowHours]
      properties:
        iso18626Url: { type: [string, "null"] }
        iso18626Vendor:
          anyOf: [{ $ref: '#/components/schemas/EntryVendor' }, { type: "null" }]
        lendersOfLastResort:
          type: array
          items: { $ref: '#/components/schemas/SymbolProperties' }
        includeRequestingAgencyInfo: { type: [boolean, "null"] }
        includeSupplierInfo: { type: [boolean, "null"] }
        includeReturnInfo: { type: [boolean, "null"] }
        includeVendorNote: { type: [boolean, "null"] }
        useOfferedCosts: { type: [boolean, "null"] }
        noteFieldSeparator: { type: [string, "null"] }
        supplierPatronPattern: { type: [string, "null"] }
        duplicateCheckWindowHours: { type: [integer, "null"], format: int32, minimum: 0 }
        defaultLoanPeriod: { type: [integer, "null"], format: int32, minimum: 1 }

    ImportCatalogConfig:
      type: object
      additionalProperties: false
      required: [profile, metadataUpdateMode, sru, zoom, queryConfig, holdingsFormat, metadataFormat]
      properties:
        profile:
          anyOf: [{ $ref: '#/components/schemas/HostLmsVendor' }, { type: "null" }]
        metadataUpdateMode:
          anyOf: [{ $ref: '#/components/schemas/MetadataUpdateMode' }, { type: "null" }]
        sru:
          anyOf: [{ $ref: '#/components/schemas/ImportSruConfig' }, { type: "null" }]
        zoom:
          anyOf: [{ $ref: '#/components/schemas/ImportZoomConfig' }, { type: "null" }]
        queryConfig:
          anyOf: [{ $ref: '#/components/schemas/ImportQueryConfig' }, { type: "null" }]
        holdingsFormat:
          anyOf: [{ $ref: '#/components/schemas/ImportHoldingsParserConfig' }, { type: "null" }]
        metadataFormat:
          anyOf: [{ $ref: '#/components/schemas/ImportMetadataParserConfig' }, { type: "null" }]
    ImportSruConfig:
      type: object
      additionalProperties: false
      required: [address, recordSchema]
      properties:
        address: { type: string }
        recordSchema: { type: [string, "null"] }

    ImportZoomConfig:
      type: object
      additionalProperties: false
      required: [address, options]
      properties:
        address: { type: string }
        options:
          type: [object, "null"]
          additionalProperties: { type: string }

    ImportQueryConfig:
      type: object
      additionalProperties: false
      required: [type, identifier, isbn, issn, title]
      properties:
        type:
          anyOf: [{ $ref: '#/components/schemas/QueryConfigType' }, { type: "null" }]
        identifier: { type: [string, "null"] }
        isbn: { type: [string, "null"] }
        issn: { type: [string, "null"] }
        title: { type: [string, "null"] }

    ImportHoldingsParserConfig:
      type: object
      additionalProperties: false
      required: [marc, marc21plus1, opac, reservoir]
      properties:
        marc:
          anyOf: [{ $ref: '#/components/schemas/ImportMarcHoldingsParserConfig' }, { type: "null" }]
        marc21plus1: { type: [object, "null"], additionalProperties: false }
        opac:
          anyOf: [{ $ref: '#/components/schemas/ImportOpacHoldingsParserConfig' }, { type: "null" }]
        reservoir: { type: [object, "null"], additionalProperties: false }

    ImportMarcHoldingsParserConfig:
      type: object
      additionalProperties: false
      required: [availability, callNumberSubField, itemIdSubField, locationSubField, mainField, restrictedSubField, shelvingLocationSubField]
      properties:
        availability:
          type: [array, "null"]
          items: { $ref: '#/components/schemas/ImportMarcAvailabilityPredicate' }
        callNumberSubField: { type: [string, "null"] }
        itemIdSubField: { type: [string, "null"] }
        locationSubField: { type: [string, "null"] }
        mainField: { type: [string, "null"] }
        restrictedSubField: { type: [string, "null"] }
        shelvingLocationSubField: { type: [string, "null"] }

    ImportMarcAvailabilityPredicate:
      type: object
      additionalProperties: false
      required: [subField, operator, value]
      properties:
        subField: { type: string, minLength: 1 }
        operator: { $ref: '#/components/schemas/MarcAvailabilityOperator' }
        value: { type: [string, "null"] }

    ImportOpacHoldingsParserConfig:
      type: object
      additionalProperties: false
      required: [availabilityRule, availablePublicNotes, requireLocalLocation, shelvingLocationSource, includeItemId, includeItemLoanPolicy, includeTemporaryLocation, allCirculations]
      properties:
        availabilityRule:
          anyOf: [{ $ref: '#/components/schemas/OpacAvailabilityRule' }, { type: "null" }]
        availablePublicNotes:
          type: [array, "null"]
          items: { type: string }
        requireLocalLocation: { type: [boolean, "null"] }
        shelvingLocationSource:
          anyOf: [{ $ref: '#/components/schemas/ShelvingLocationSource' }, { type: "null" }]
        includeItemId: { type: [boolean, "null"] }
        includeItemLoanPolicy: { type: [boolean, "null"] }
        includeTemporaryLocation: { type: [boolean, "null"] }
        allCirculations: { type: [boolean, "null"] }

    ImportMetadataParserConfig:
      type: object
      additionalProperties: false
      required: [marc21]
      properties:
        marc21:
