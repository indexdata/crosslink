openapi: "3.1.0"
info:
  version: 1.0.0
  title: Directory API
servers:
  - url: /directory
paths:
  /import:
    post:
      summary: Import complete directory aggregates
      description: Imports ordered NDJSON entry, tier, and network aggregates. Parent entries must appear in earlier committed records.
      operationId: postImport
      parameters:
        - name: conflictPolicy
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ConflictPolicy'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
              format: binary
            x-ndjson-item-schema:
              $ref: '#/components/schemas/ImportRecord'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid import request
          content:
            text/plain:
              schema: { type: string }
        '401':
          description: Access denied
          content:
            text/plain:
              schema: { type: string }
        '413':
          description: Import request or record is too large
          content:
            text/plain:
              schema: { type: string }
        '500':
          description: Failed to read the import stream
          content:
            text/plain:
              schema: { type: string }
  /entries:
    get:
      summary: Returns all entries
      description: Returns all entries from the system that the user has access to.
      operationId: getEntries
      parameters:
        - name: cql
          in: query
          description: CQL query filter. The parentSymbol index matches entries by their immediate parent's symbols.
          required: false
          style: form
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Entry list response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntriesResponse'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Access denied
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
    post:
      summary: Creates a new entry
      description: Creates a new entry
      operationId: addEntry
      requestBody:
        description: Entry to add
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEntry'
      responses:
        '201':
          description: Entry response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Id'
          links:
            GetEntryByID:
              operationId: getEntry
              parameters:
                key: 'id'
                value: '$response.body#/id'
            UpdateEntry:
              operationId: updateEntry
              parameters:
                key: 'id'
                value: '$response.body#/id'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Access denied
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
  /entries/owned:
    get:
      summary: Returns entries owned by the current tenant
      description: Returns entries whose tenant matches the tenant in the authentication data.
      operationId: getOwnedEntries
      parameters:
        - name: cql
          in: query
          description: CQL query filter applied within the current tenant's owned entries. The parentSymbol index matches entries by their immediate parent's symbols.
          required: false
          style: form
          schema:
