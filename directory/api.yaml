        author: { type: [string, "null"] }
        edition: { type: [string, "null"] }
        identifier: { type: [string, "null"] }
        isbn: { type: [string, "null"] }
        issn: { type: [string, "null"] }
        subtitle: { type: [string, "null"] }
        title: { type: [string, "null"] }

    ImportHoldingsPolicy:
      type: object
      additionalProperties: false
      required: [locations, shelvingLocations, locationPolicies, itemLoanPolicies]
      properties:
        locations:
          type: array
          items: { $ref: '#/components/schemas/HoldingsLocation' }
        shelvingLocations:
          type: array
          items: { $ref: '#/components/schemas/HoldingsShelvingLocation' }
        locationPolicies:
          type: array
          items: { $ref: '#/components/schemas/ImportHoldingsLocationPolicy' }
        itemLoanPolicies:
          type: array
          items: { $ref: '#/components/schemas/HoldingsItemLoanPolicy' }

    ImportHoldingsLocationPolicy:
      type: object
      additionalProperties: false
      required: [locationCode, shelvingLocationCode, supplyPreference]
      properties:
        locationCode: { type: [string, "null"] }
        shelvingLocationCode: { type: string }
        supplyPreference: { $ref: '#/components/schemas/HoldingsSupplyPreference' }

    ImportEntryData:
      type: object
      additionalProperties: false
      required: [name, type, parent, description, organizationId, contactName, email, fromEmail, tenant, vendor, phoneNumber, lmsLocationCode, hrid, timeZone, symbols, endpoints, addresses, closures, lmsConfig, catalogConfig, illConfig, holdingsPolicy]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/EntryType' }
        parent:
          anyOf: [{ $ref: '#/components/schemas/SymbolProperties' }, { type: "null" }]
        description: { type: [string, "null"] }
        organizationId: { type: [string, "null"] }
        contactName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        fromEmail: { type: [string, "null"] }
        tenant: { type: [string, "null"] }
        vendor:
          anyOf: [{ $ref: '#/components/schemas/EntryVendor' }, { type: "null" }]
        phoneNumber: { type: [string, "null"] }
        lmsLocationCode: { type: [string, "null"] }
        hrid: { type: [string, "null"] }
        timeZone: { type: [string, "null"] }
        symbols:
          type: array
          items: { $ref: '#/components/schemas/SymbolProperties' }
        endpoints:
          type: array
          items: { $ref: '#/components/schemas/ServiceEndpointProperties' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/ImportAddress' }
        closures:
          type: array
          items: { $ref: '#/components/schemas/ClosureProperties' }
        lmsConfig:
          anyOf: [{ $ref: '#/components/schemas/ImportLmsConfig' }, { type: "null" }]
        catalogConfig:
          anyOf: [{ $ref: '#/components/schemas/ImportCatalogConfig' }, { type: "null" }]
        illConfig:
          anyOf: [{ $ref: '#/components/schemas/ImportIllConfig' }, { type: "null" }]
        holdingsPolicy:
          anyOf: [{ $ref: '#/components/schemas/ImportHoldingsPolicy' }, { type: "null" }]
    ImportTierData:
      type: object
      additionalProperties: false
      required: [level, type, cost, entries]
      properties:
        level: { $ref: '#/components/schemas/TierLevel' }
        type: { $ref: '#/components/schemas/TierType' }
        cost: { type: number, format: double }
        entries:
          type: array
          items: { $ref: '#/components/schemas/SymbolProperties' }

    ImportNetworkData:
      type: object
      additionalProperties: false
      required: [reciprocal, entries]
      properties:
