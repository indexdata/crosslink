          nullable: true
        requestItemRequestType:
          type: string
          nullable: true
        requestItemRequestScopeType:
          type: string
          nullable: true
        requestItemBibIdCode:
          type: string
          nullable: true
        requestItemPickupLocationEnabled:
          type: boolean
          nullable: true
        requesterPickupLocation:
          type: string
          nullable: true
        supplierPickupLocation:
          type: string
          nullable: true
        requesterPatronPattern:
          type: string
          nullable: true
        patronProfiles:
          allOf:
            - $ref: '#/components/schemas/PatronProfiles'
          nullable: true

