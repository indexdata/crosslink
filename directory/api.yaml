      operationId: getClosure
      parameters:
        - name: id
          in: path
          description: ID of Closure to fetch
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Closure response
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Closure'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Forbidden
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
    patch:
      summary: Update a Closure
      description: Update a Closure
      operationId: updateClosure
      parameters:
        - name: id
          in: path
          description: ID of Closure to update
          required: true
          schema: 
            type: string
            format: uuid
      requestBody:
        description: Updated fields
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosurePatch'
      responses:
        '204':
          description: Closure updated
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Access denied
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
    delete:
      summary: Delete Closure by ID
      operationId: deleteClosure
      parameters:
        - name: id
          in: path
          description: ID of Closure to delete
          required: true
          schema: 
            type: string
            format: uuid
      responses:
        '204':
          description: Closure deleted
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Access denied
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    Offset:
      name: offset
      in: query
      description: Offset for pagination (first item is 0)
      schema:
        type: integer
        format: int32
        minimum: 0
    Limit:
      name: limit
      in: query
      description: Limit for pagination
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 1000
        default: 10
    entryLookupKey:
      name: key
      in: path
      description: Key to look up entry, either 'id' or 'symbol'
      required: true
      schema:
        type: string
        enum: [by-id, by-symbol]
    entryLookupValue:
      name: value
      in: path
      description: Value of id or symbol to access entry by
      required: true
      schema:
        type: string

  schemas:
    NetworksResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Network'
    TiersResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tier'
    EntriesResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
    ClosuresResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Closure'
    EntryNetworksResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryNetwork'
    EntryTiersResponse:
      type: object
      required:
        - about
        - items
      properties:
        about:
          $ref: '#/components/schemas/About'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryTier'
    About:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
          description: Total number of items in the result
        nextLink:
          type: string
          description: Link to the next page of results
        prevLink:
          type: string
          description: Link to the previous page of results
    Id:
      required:
        - id
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique id
    Entry:
      type: object
      required:
        - id
        - name
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique id
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - Institution
          - Consortium
          - Branch
        parent:
          type: string
          format: uuid
        description:
          type: string
        organizationId:
          type: string
        contactName:
          type: string
        email:
          type: string
        fromEmail:
          type: string
        tenant:
          type: string
        vendor:
          $ref: '#/components/schemas/EntryVendor'
        phoneNumber:
          type: string
        lmsLocationCode:
          type: string
        illConfig:
          $ref: '#/components/schemas/IllConfig'
        hrid:
          type: string
        timeZone:
          type: string
        symbols:
          type: array
          items:
            $ref: '#/components/schemas/Symbol'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/Closure'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ServiceEndpoint'
        networks:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Network'
        tiers:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/Tier'
        lmsConfig:
          description: Configuration for LMS (Library Management System) integration via NCIP protocol
          $ref: '#/components/schemas/LmsConfig'
        catalogConfig:
          $ref: '#/components/schemas/CatalogConfig'
        holdingsPolicy:
          description: Policy that determines whether and in which order holdings may supply an item.
          $ref: '#/components/schemas/HoldingsPolicy'
    IllConfig:
      type: object
      properties:
        iso18626Url:
          type: string
          description: URL of the ISO18626 service. When set, used instead of an ISO18626 service from endpoints.
        iso18626Vendor:
          description: ISO18626 service vendor. Used only when iso18626Url is non-empty.
          $ref: '#/components/schemas/EntryVendor'
        lendersOfLastResort:
          type: array
          description: Suppliers appended to the end of the rota when no regular supplier can fill the request.
          items:
            $ref: '#/components/schemas/Symbol'
        includeRequestingAgencyInfo:
          type: boolean
          description: Whether outgoing requests include requestingAgencyInfo populated from the requester directory entry.
        includeSupplierInfo:
          type: boolean
          description: Whether outgoing requests include supplierInfo populated from the supplier directory entry.
        includeReturnInfo:
          type: boolean
          description: Whether Loaned messages include returnInfo populated from the supplier directory entry.
        includeVendorNote:
          type: boolean
          description: Whether broker-generated supplying-agency messages include the supplier vendor in the note.
        useOfferedCosts:
          type: boolean
          description: Whether deliveryCosts are transferred to offeredCosts for messages sent to this requester.
        noteFieldSeparator:
          type: string
          description: Separator used between fields added to notes in messages sent to this entry.
        supplierPatronPattern:
          type: string
          description: Format pattern used to create a patron ID for requests received by this supplier.
        duplicateCheckWindowHours:
          type: integer
          format: int32
          description: The number of hours to check for duplicate requests. If a request is submitted within this window, it will be considered a duplicate.
          minimum: 0
    EntryVendor:
      type: string
      description: ISO18626 vendor type
      enum:
        - Alma
        - ReShare
        - CrossLink
        - ILLiad
        - Unknown
    CatalogConfig:
      type: object
      properties:
        sru:
          $ref: '#/components/schemas/SruConfig'
        zoom:
          $ref: '#/components/schemas/ZoomConfig'
        queryConfig:
          $ref: '#/components/schemas/QueryConfig'
        holdingsFormat:
          $ref: '#/components/schemas/HoldingsParserConfig'
        metadataUpdateMode:
          $ref: '#/components/schemas/MetadataUpdateMode'
        metadataFormat:
          $ref: '#/components/schemas/MetadataParserConfig'
      additionalProperties: false
    CatalogConfigPatch:
      type: object
      properties:
        sru:
          $ref: '#/components/schemas/SruConfigPatch'
        zoom:
          $ref: '#/components/schemas/ZoomConfigPatch'
        queryConfig:
          $ref: '#/components/schemas/QueryConfig'
        holdingsFormat:
          $ref: '#/components/schemas/HoldingsParserConfig'
        metadataUpdateMode:
          $ref: '#/components/schemas/MetadataUpdateMode'
        metadataFormat:
          $ref: '#/components/schemas/MetadataParserConfig'
      additionalProperties: false
    MetadataUpdateMode:
      type: string
      description: Determines how lookup metadata updates the outgoing ILL request metadata.
      enum: [replace, merge, none, auto]
    SruConfig:
      type: object
      required: [address]
      properties:
        address:
          type: string
        recordSchema:
          type: string
      additionalProperties: false
    SruConfigPatch:
      type: object
      properties:
        address:
          type: string
        recordSchema:
          type: string
      additionalProperties: false
    ZoomConfig:
      type: object
      required: [address]
      properties:
        address:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
      additionalProperties: false
    ZoomConfigPatch:
      type: object
      properties:
        address:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
            nullable: true
      additionalProperties: false
    QueryConfig:
      type: object
      properties:
        type:
          type: string
          enum: [cql, pqf]
          default: pqf
        title:
          type: string
        isbn:
          type: string
        issn:
          type: string
        identifier:
          type: string
      additionalProperties: false
    MetadataParserConfig:
      type: object
      properties:
        marc21:
          $ref: '#/components/schemas/MarcMetadataParserConfig'
      additionalProperties: false
    MarcMetadataParserConfig:
      type: object
      properties:
        identifier: { type: string }
        isbn: { type: string }
        issn: { type: string }
        title: { type: string }
        subtitle: { type: string }
        author: { type: string }
        edition: { type: string }
      additionalProperties: false
    HoldingsParserConfig:
      type: object
      properties:
        marc:
          $ref: '#/components/schemas/MarcHoldingsParserConfig'
        opac:
          $ref: '#/components/schemas/OpacHoldingsParserConfig'
        reservoir:
          type: object
          additionalProperties: false
        marc21plus1:
          type: object
          additionalProperties: false
      additionalProperties: false
    MarcHoldingsParserConfig:
      type: object
      properties:
        mainField: { type: string }
        locationSubField: { type: string }
        shelvingLocationSubField: { type: string }
        itemIdSubField: { type: string }
        restrictedSubField: { type: string }
        callNumberSubField: { type: string }
      additionalProperties: false
    OpacHoldingsParserConfig:
      type: object
      additionalProperties: false
    EntryPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - Institution
            - Consortium
            - Branch
          nullable: true
        parent:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        organizationId:
          type: string
          nullable: true
        contactName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        fromEmail:
          type: string
          nullable: true
        tenant:
          type: string
          nullable: true
        vendor:
          allOf:
            - $ref: '#/components/schemas/EntryVendor'
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        lmsLocationCode:
          type: string
          nullable: true
        illConfig:
          allOf:
            - $ref: '#/components/schemas/IllConfig'
          nullable: true
        hrid:
          type: string
          nullable: true
        timeZone:
          type: string
          nullable: true
        lmsConfig:
          allOf:
            - $ref: '#/components/schemas/LmsConfigPatch'
          nullable: true
        catalogConfig:
          allOf:
            - $ref: '#/components/schemas/CatalogConfigPatch'
          nullable: true
        holdingsPolicy:
          allOf:
            - $ref: '#/components/schemas/HoldingsPolicy'
          nullable: true
        symbols:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SymbolPatch'
        endpoints:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ServiceEndpointPatch'
        addresses:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AddressPatch'
        closures:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ClosurePatch'

    HoldingsPolicy:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/HoldingsLocation'
        shelvingLocations:
          type: array
          items:
            $ref: '#/components/schemas/HoldingsShelvingLocation'
        locationPolicies:
          type: array
          items:
            $ref: '#/components/schemas/HoldingsLocationPolicy'
        itemLoanPolicies:
          type: array
          items:
            $ref: '#/components/schemas/HoldingsItemLoanPolicy'
      additionalProperties: false

    HoldingsLocation:
      type: object
      required:
        - code
        - name
        - supplyPreference
      properties:
        code:
          type: string
          description: Location code (for example, "MAIN").
        name:
          type: string
          description: Human-readable location name (for example, "Main Library").
        supplyPreference:
          $ref: '#/components/schemas/HoldingsSupplyPreference'
      additionalProperties: false

    HoldingsShelvingLocation:
      type: object
      required:
        - code
        - name
        - supplyPreference
      properties:
        code:
          type: string
          description: Shelving location code (for example, "STACKS").
        name:
          type: string
          description: Human-readable shelving location name (for example, "Stacks").
        supplyPreference:
          $ref: '#/components/schemas/HoldingsSupplyPreference'
      additionalProperties: false

    HoldingsLocationPolicy:
      type: object
      required:
        - shelvingLocationCode
        - supplyPreference
      properties:
        locationCode:
          type: string
          description: Location code. When omitted, the override applies across all locations.
        shelvingLocationCode:
          type: string
          description: Shelving location code to which the override applies.
        supplyPreference:
          $ref: '#/components/schemas/HoldingsSupplyPreference'
      additionalProperties: false

    HoldingsItemLoanPolicy:
      type: object
      required:
        - code
        - name
        - lendable
      properties:
        code:
          type: string
          description: Item loan policy code (for example, "NORMAL").
        name:
          type: string
          description: Human-readable item loan policy name (for example, "Normal loan").
        lendable:
          type: boolean
          description: Whether items governed by this loan policy may be supplied.
      additionalProperties: false

    HoldingsSupplyPreference:
      type: integer
      minimum: -1
      maximum: 10000
      description: Supply preference where -1 disables supply, 0 means no preference, and 10000 is the highest preference.

    LmsConfig:
      type: object
      required:
        - address
        - fromAgency
      properties:
        address:
          type: string
          description: Base URL of the LMS API
        fromAgency:
          type: string
          description: Agency code used when the entry is acting as the supplying agency
        fromAgencyAuthentication:
          type: string
          x-oapi-codegen-extra-tags:
            protected: "true"
          description: Authentication token or credentials for the fromAgency
        toAgency:
          type: string
          description: Agency code used when the entry is acting as the requesting agency
        lookupUserEnabled:
          type: boolean
          description: Whether user lookup is enabled
          default: true
        acceptItemEnabled:
          type: boolean
          description: Whether item acceptance is enabled
          default: true
        checkInItemEnabled:
          type: boolean
          description: Whether item check-in is enabled
          default: true
        checkOutItemEnabled:
          type: boolean
          description: Whether item check-out is enabled
          default: true
        requestItemEnabled:
          type: boolean
          description: Whether item requesting is enabled
          default: true
        itemLocation:
          type: string
          description: Location code to include in NCIP RequestItem messages
          default: ""
        requestItemRequestType:
          type: string
          description: For Request Item requests, the type of request to create
          default: Page
        requestItemRequestScopeType:
          type: string
          description: For Request Item requests, the scope type of request to create
          default: Item
        requestItemBibIdCode:
          type: string
          description: For Request Item requests, the code indicating how to interpret the bib id
          default: SYSNUMBER
        requestItemPickupLocationEnabled:
          type: boolean
          description: Whether to include a pickup location when making Request Item requests
          default: true
        requesterPickupLocation:
          type: string
          description: Pickup location code used when acting as requesting agency
          default: Main Library
        supplierPickupLocation:
          type: string
          description: Pickup location code used when acting as supplying agency
          default: ILL Office
        requesterPatronPattern:
          type: string
          description: "'{requesterSymbol}' occurrences are replaced with requesting agency ISIL"
          default: "INST-{requesterSymbol}"
        patronProfiles:
          description: Patron profiles used to determine whether a user returned by NCIP LookupUser is eligible to create ILL requests.
          $ref: '#/components/schemas/PatronProfiles'

    PatronProfiles:
      type: array
      description: Patron profile eligibility rules, inspected in order until both configured profile components match.
      items:
        $ref: '#/components/schemas/PatronProfile'

    PatronProfile:
      type: object
      required:
        - canCreateRequests
      properties:
        code:
          type: string
          minLength: 1
          description: Profile code returned by the LMS (for example, "STAFF"). When omitted, any code matches.
        name:
          type: string
          minLength: 1
          description: Profile name returned by the LMS (for example, "Staff"). When omitted, any name matches.
        canCreateRequests:
          type: boolean
          description: Whether patrons with this profile may create ILL requests.
      additionalProperties: false

    LmsConfigPatch:
      type: object
      properties:
        address:
          type: string
        fromAgency:
          type: string
        fromAgencyAuthentication:
          type: string
          nullable: true
        toAgency:
          type: string
          nullable: true
        lookupUserEnabled:
          type: boolean
          nullable: true
        acceptItemEnabled:
          type: boolean
          nullable: true
        checkInItemEnabled:
          type: boolean
          nullable: true
        checkOutItemEnabled:
          type: boolean
          nullable: true
        requestItemEnabled:
          type: boolean
          nullable: true
        itemLocation:
          type: string
          nullable: true
        requestItemRequestType:
          type: string
          nullable: true
        requestItemRequestScopeType:
          type: string
          nullable: true
        requestItemBibIdCode:
          type: string
          nullable: true
        requestItemPickupLocationEnabled:
          type: boolean
          nullable: true
        requesterPickupLocation:
          type: string
          nullable: true
        supplierPickupLocation:
          type: string
          nullable: true
        requesterPatronPattern:
          type: string
          nullable: true
        patronProfiles:
          allOf:
            - $ref: '#/components/schemas/PatronProfiles'
          nullable: true

    SymbolProperties:
      required:
        - symbol
        - authority
      properties:
        symbol:
          type: string
          description: Uppercase string
        authority:
          type: string
          description: Uppercase string
    Symbol:
      allOf:
        - required:
          - id
          properties:
            id:
              readOnly: true
              type: string
              format: uuid
              description: Unique id
        - $ref: '#/components/schemas/SymbolProperties'
    SymbolPatch:
      allOf:
        - properties:
            id:
              type: string
              format: uuid
              description: Unique id
        - $ref: '#/components/schemas/SymbolProperties'

    ServiceEndpointProperties:
      type: object
      required:
        - name
        - type
        - address
      properties:
        name:
          type: string
        type:
          type: string
        address:
          type: string
    ServiceEndpoint:
      allOf:
        - required:
          - id
          properties:
            id:
              readOnly: true
              type: string
              format: uuid
              description: Unique id
        - $ref: '#/components/schemas/ServiceEndpointProperties'
    ServiceEndpointPatch:
      allOf:
        - properties:
            id:
              type: string
              format: uuid
              description: Unique id
        - $ref: '#/components/schemas/ServiceEndpointProperties'

    AddressComponent:
      type: object
      required:
        - seq
        - type
        - value
      properties:
        seq:
          type: integer
          format: int32
          description: Sequence number for ordering components
        type:
          type: string
          enum:
            - Thoroughfare
            - Locality
            - AdministrativeArea
            - PostalCode
            - CountryCode
            - Other
        value:
          type: string

    AddressProperties:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Default
            - Shipping
            - Billing
            - Other
        addressComponents:
          type: array
          items:
            $ref: '#/components/schemas/AddressComponent'
    Address:
      allOf:
        - required:
          - id
          - entry
          properties:
            id:
              readOnly: true
              type: string
              format: uuid
              description: Unique id
            entry:
              readOnly: true
              type: string
              format: uuid
        - $ref: '#/components/schemas/AddressProperties'
    AddressPatch:
      allOf:
        - properties:
            id:
              type: string
              format: uuid
              description: Unique id
        - $ref: '#/components/schemas/AddressProperties'

    Closure:
      type: object
      required:
        - id
        - entry
        - startDate
        - endDate
        - reason
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique identifier
        entry:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
          description: ISO8601 date
        endDate:
          type: string
          format: date
          description: ISO8601 date
        reason:
          type: string
    ClosurePatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier
        startDate:
          type: string
          format: date
          description: ISO8601 date
        endDate:
          type: string
          format: date
          description: ISO8601 date
        reason:
          type: string

    Network:
      type: object
      required:
        - id
        - consortium
        - priority
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique identifier
        consortium:
          type: string
          format: uuid
        name:
          type: string
        priority:
          type: integer
          format: int32
          default: 0
        reciprocal:
          type: boolean

    Tier:
      type: object
      required:
        - id
        - consortium
        - level
        - type
        - cost
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique identifier
        consortium:
          type: string
          format: uuid
        name:
          type: string
        level:
          type: string
          enum:
            - express
            - normal
            - rush
            - secondarymail
            - standard
            - urgent
          default: standard
        type:
          type: string
          enum:
            - loan
            - copy
          default: loan
        cost:
          type: number
          format: double
          default: 0.0
    
    EntryNetwork:
      type: object
      required:
        - id
        - entry
        - network
      properties:
        id:
          readOnly: true
          type: string
          format: uuid
          description: Unique identifier
        entry:
          type: string
          format: uuid
          description: ID of entry
        network:
          type: string
          format: uuid
          description: ID of network

    EntryTier:
      type: object
      required:
        - id
        - entry
        - tier
