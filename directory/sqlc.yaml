version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "query.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - column: "ill_configs.unfilled_reasons"
            go_type:
              import: "github.com/indexdata/crosslink/directory/domain"
              type: "IllConfigCodeDescriptions"
              pointer: true
          - column: "ill_configs.cancellation_reasons"
            go_type:
              import: "github.com/indexdata/crosslink/directory/domain"
              type: "IllConfigCodeDescriptions"
              pointer: true
          - column: "ill_configs.loan_conditions"
            go_type:
              import: "github.com/indexdata/crosslink/directory/domain"
              type: "IllConfigCodeDescriptions"
              pointer: true
