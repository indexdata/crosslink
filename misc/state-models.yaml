stateModels:
  default:
    type: StateModel
    name: CrossLink State Model
    desc: "Requester/Supplier workflow for returnable loans and non-returnable copies over ISO18626."
    version: 3.1.0
    selector:
      serviceType: [Copy, Loan, CopyOrLoan]
    states:
      # ── REQUESTER states ──────────────────────────────────────────────────────
      - name: NEW
        display: New
        desc: Initial state after Patron Request is created (POST)
        side: REQUESTER
        initial: true
        editable: true
        primaryAction: validate-patron
        closingAction: close-request
        actions:
          - name: validate-patron
            desc: "Validate the patron via NCIP LookupUser, if enabled"
            transitions:
              success: VALIDATED
              review: INVALID_PATRON
            trigger: auto
          - name: skip-patron-validation
            desc: Continue without validating the patron
            transitions:
              success: VALIDATED
          - name: close-request
            desc: Close the request locally
            transitions:
              success: MANUALLY_CLOSED

      - name: INVALID_PATRON
        display: Invalid Patron
        desc: Patron validation was rejected by the LMS
        side: REQUESTER
        primaryAction: validate-patron
        closingAction: close-request
        needsAttention: true
        editable: true
        actions:
          - name: validate-patron
            desc: Revalidate the patron after correcting the request
            transitions:
              success: VALIDATED
              review: INVALID_PATRON
          - name: skip-patron-validation
            desc: Continue without validating the patron
            transitions:
              success: VALIDATED
          - name: close-request
            desc: Close the request locally
            transitions:
              success: MANUALLY_CLOSED

      - name: VALIDATED
        display: Patron Validated
        desc: Patron validation has completed or been skipped
        side: REQUESTER
        primaryAction: update-metadata
        closingAction: close-request
        actions:
          - name: update-metadata
            desc: Update the request metadata
            transitions:
              success: METADATA_UPDATED
              review: NEEDS_REVIEW
            trigger: auto
          - name: skip-metadata-update
            desc: Continue without updating the request metadata
            transitions:
              success: METADATA_UPDATED
          - name: close-request
            desc: Close the request locally
            transitions:
              success: MANUALLY_CLOSED

      - name: METADATA_UPDATED
        display: Metadata Updated
        desc: Request metadata update has completed or been skipped
        side: REQUESTER
        primaryAction: send-request
        closingAction: close-request
        actions:
          - name: send-request
            desc: Send ISO18626 request to the supplier or broker
            transitions:
              success: SENT
              duplicate: DUPLICATE
            trigger: auto
          - name: close-request
            desc: Close the request locally
            transitions:
              success: MANUALLY_CLOSED

      - name: NEEDS_REVIEW
        display: Needs review
        desc: Request is valid but needs staff review before sending
        side: REQUESTER
        primaryAction: send-request
        closingAction: close-request
        needsAttention: true
        editable: true
        actions:
          - name: send-request
            desc: Send ISO18626 request to the supplier or broker
            transitions:
              success: SENT
              duplicate: DUPLICATE
          - name: close-request
            desc: Close the request locally
            transitions:
              success: MANUALLY_CLOSED

      - name: DUPLICATE
        display: Duplicate
        desc: A duplicate request was reported by the supplier or broker
        side: REQUESTER
        primaryAction: send-request
        needsAttention: true
        editable: true
        closingAction: close-request
        actions:
          - name: send-request
            desc: Retry sending the request to the supplier or broker
            transitions:
              success: SENT
              duplicate: DUPLICATE
          - name: close-request
            desc: Close the duplicate request
            transitions:
              success: CLOSED_DUPLICATE

      - name: LOCAL_SUPPLY
        display: Local Supply
        desc: The requested item or document is available locally
        side: REQUESTER
        needsAttention: true
        editable: true
        # Audit-only events emitted by local-supply actions. Do not configure
        # transitions as they are ignored, use action transitions instead.
        events:
          - name: completed-local
            desc: Local-supply completion recorded for audit
          - name: cancelled-local
            desc: Local-supply cancellation recorded for audit
          - name: unfilled-local
            desc: Local-supply failure recorded for audit
        actions:
          - name: fill-locally
            desc: Fill the request locally
            appliesTo:
              serviceTypes:
                - Loan
                - CopyOrLoan
            primaryFor:
              serviceTypes:
                - Loan
                - CopyOrLoan
            transitions:
              success: COMPLETED
          - name: supply-document
            desc: Attach a document URL and complete the local copy supply
            appliesTo:
              serviceTypes:
                - Copy
                - CopyOrLoan
            primaryFor:
              serviceTypes:
                - Copy
            transitions:
              success: COMPLETED
          - name: cancel-local-supply
            desc: Cancel the local supply
            transitions:
              success: CANCELLED
          - name: cannot-supply-locally
            desc: Cannot supply locally
            transitions:
              success: SENT

      - name: SENT
        display: Sent
        desc: Request is sent
        side: REQUESTER
        events:
          - name: expect-to-supply
            desc: "Supplier indicates an intention to supply (ISO18626 ExpectToSupply)"
            transition: SUPPLIER_LOCATED
          - name: expect-to-supply-local
            desc: "Local supplier indicates an intention to supply (ISO18626 ExpectToSupply)"
            transition: LOCAL_SUPPLY
          - name: will-supply
            desc: "Supplier will supply without conditions (ISO18626 WillSupply)"
            transition: WILL_SUPPLY
          - name: will-supply-conditional
            desc: "Supplier will supply with conditions (ISO18626 WillSupply with conditions)"
            transition: CONDITION_PENDING
          - name: loaned
            desc: "Supplier shipped the item (ISO18626 Loaned)"
            transition: SHIPPED
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: completed
            desc: "Supplier delivered the document (ISO18626 CopyCompleted)"
            transition: COMPLETED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
          - name: unfilled
            desc: "Supplier cannot supply (ISO18626 Unfilled)"
            transition: UNFILLED
          - name: retry-conditional
            desc: Received retry from supplier
            transition: RETRY_PENDING

      - name: SUPPLIER_LOCATED
        display: Supplier Located
        desc: After receiving ISO ExpectToSupply
        side: REQUESTER
        primaryAction: cancel-request
        actions:
          - name: cancel-request
            desc: Send ISO18626 Cancel request to supplier
            transitions:
              success: CANCEL_PENDING
        events:
          - name: will-supply
            desc: "Supplier will supply without conditions (ISO18626 WillSupply)"
            transition: WILL_SUPPLY
          - name: will-supply-conditional
            desc: "Supplier will supply with conditions (ISO18626 WillSupply with conditions)"
            transition: CONDITION_PENDING
          - name: retry-conditional
            desc: Received retry from supplier
            transition: RETRY_PENDING
          - name: loaned
            desc: "Supplier shipped the item (ISO18626 Loaned)"
            transition: SHIPPED
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: completed
            desc: "Supplier delivered the document (ISO18626 CopyCompleted)"
            transition: COMPLETED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
          - name: unfilled
            desc: "Supplier cannot supply (ISO18626 Unfilled)"
            transition: UNFILLED

      - name: CONDITION_PENDING
        display: Condition Pending
        desc: Received supply conditions
        side: REQUESTER
        primaryAction: accept-condition
        needsAttention: true
        actions:
          - name: accept-condition
            desc: "Accept supplier conditions (ISO18626 Notification)"
            transitions:
              success: WILL_SUPPLY
          - name: reject-condition
            desc: "Reject supplier conditions (ISO18626 Cancel)"
            transitions:
              success: CANCEL_PENDING
        events:
          - name: will-supply-conditional
            desc: Supplier updates/extends conditions while still pending
            transition: CONDITION_PENDING
          - name: completed
            desc: "Supplier delivered the document (ISO18626 CopyCompleted)"
            transition: COMPLETED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
          - name: unfilled
            desc: "Supplier cannot supply (ISO18626 Unfilled)"
            transition: UNFILLED

      - name: RETRY_PENDING
        display: Retry Pending
        desc: "Received ISO18626 RetryPossible from supplier (may include updated metadata/conditions)"
        side: REQUESTER
        primaryAction: accept-retry
        needsAttention: true
        actions:
          - name: accept-retry
            desc: Requester accepts supplier retry request
            transitions:
              success: RETRY_ACCEPTED
          - name: reject-retry
            desc: Requester rejects supplier retry request
            transitions:
              success: RETRY_REJECTED

      - name: WILL_SUPPLY
        display: Will Supply
        desc: "Received ISO18626 WillSupply (without condition)"
        side: REQUESTER
        primaryAction: cancel-request
        actions:
          - name: cancel-request
            desc: Send ISO18626 Cancel to supplier
            transitions:
              success: CANCEL_PENDING
        events:
          - name: will-supply-conditional
            desc: "Supplier adds conditions after initial WillSupply (ISO18626 WillSupply with conditions)"
            transition: CONDITION_PENDING
          - name: retry-conditional
            desc: Received retry from supplier
            transition: RETRY_PENDING
          - name: loaned
            desc: "Supplier shipped the item (ISO18626 Loaned)"
            transition: SHIPPED
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: completed
            desc: "Supplier delivered the document (ISO18626 CopyCompleted)"
            transition: COMPLETED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
          - name: unfilled
            desc: "Supplier cannot supply (ISO18626 Unfilled)"
            transition: UNFILLED

      - name: SHIPPED
        display: Shipped
        desc: After receiving ISO18626 Loaned
        side: REQUESTER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        primaryAction: receive
        actions:
          - name: receive
            desc: "Receive and accept item in local ILS (via NCIP AcceptItem if enabled); send ISO18626 Received"
            transitions:
              success: RECEIVED

      - name: RECEIVED
        display: Received
        desc: Item received and accepted into local ILS.
        side: REQUESTER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        primaryAction: check-out
        actions:
          - name: check-out
            desc: Check out item to patron (NCIP CheckOutItem)
            transitions:
              success: CHECKED_OUT
          - name: send-notification
            desc: Send email notification when the item is received
            trigger: auto
            params:
              sendTo:
                - patron
              templateLabel: received-notification

      - name: CHECKED_OUT
        display: Checked Out
        desc: Item is checked out to patron
        side: REQUESTER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        primaryAction: check-in
        actions:
          - name: check-in
            desc: Check the item back-in (NCIP CheckInItem)
            transitions:
              success: CHECKED_IN

      - name: CHECKED_IN
        display: Checked In
        desc: Item is checked back in to the local ILS
        side: REQUESTER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        primaryAction: ship-return
        actions:
          - name: ship-return
            desc: "Send ISO18626 ShippedReturn and delete the temporary item (NCIP DeleteItem)"
            transitions:
              success: SHIPPED_RETURNED

      - name: SHIPPED_RETURNED
        display: Shipped Returned
        desc: Item is in return shipment
        side: REQUESTER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        events:
          - name: completed
            desc: Supplier/broker signals loan/copy completion
            transition: COMPLETED

      - name: CANCEL_PENDING
        display: Cancel Pending
        desc: ISO18626 Cancel action is sent to supplier/broker
        side: REQUESTER
        events:
          - name: cancel-accepted
            desc: Supplier accepts cancellation
            transition: CANCELLED
          - name: cancel-rejected
            desc: Supplier rejects cancellation
            transition: WILL_SUPPLY
          - name: completed
            desc: Supplier completes document delivery before cancellation takes effect
            transition: COMPLETED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
          - name: unfilled
            desc: Supplier cannot supply the document
            transition: UNFILLED
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]

      - name: COMPLETED
        display: Completed
        desc: Loan or document supply was completed
        side: REQUESTER
        terminal: true

      - name: CANCELLED
        display: Cancelled
        desc: Cancel response is received
        side: REQUESTER
        terminal: true
        actions:
          - name: send-notification
            desc: Send email notification when the request is cancelled
            trigger: auto
            params:
              sendTo:
                - patron
              templateLabel: cancelled-notification

      - name: UNFILLED
        display: Unfilled
        desc: Unfilled response is received
        side: REQUESTER
        terminal: true
        actions:
          - name: send-notification
            desc: Send email notification when item is unfilled
            trigger: auto
            params:
              sendTo:
                - patron
              templateLabel: unfilled-notification

      - name: RETRY_ACCEPTED
        display: Retry Accepted
        desc: Requester accepted supplier retry request with new metadata
        side: REQUESTER
        terminal: true

      - name: RETRY_REJECTED
        display: Retry Rejected
        desc: Requester rejected supplier retry request
        side: REQUESTER
        terminal: true

      - name: MANUALLY_CLOSED
        display: Manually closed
        desc: Closed manually by staff
        side: REQUESTER
        terminal: true
        manualClose: true

      - name: CLOSED_DUPLICATE
        display: Closed Duplicate
        desc: Closed due to duplicate request
        side: REQUESTER
        terminal: true

      # ── SUPPLIER states ──────────────────────────────────────────────────────
      - name: NEW
        display: New
        desc: Request is created on the supplier side for local fulfillment
        side: SUPPLIER
        initial: true
        primaryAction: validate-patron
        actions:
          - name: send-notification
            desc: Send staff email notification when a new supply request is received
            trigger: auto
            params:
              sendTo:
                - staff
              templateLabel: new-supply-request-notification
          - name: validate-patron
            desc: "Validate the institutional patron via NCIP LookupUser, if enabled"
            transitions:
              success: VALIDATED
            trigger: auto

      - name: VALIDATED
        display: Validated
        desc: Request is valid
        side: SUPPLIER
        primaryAction: will-supply
        closingAction: cannot-supply
        actions:
          - name: will-supply
            desc: Indicate supplier will supply and send ISO18626 WillSupply
            transitions:
              success: WILL_SUPPLY
              failure: VALIDATED
            trigger: auto
          - name: cannot-supply
            desc: Indicate cannot supply and send ISO18626 Unfilled
            transitions:
              success: UNFILLED
          - name: add-condition
            desc: Indicate will supply with conditions and send ISO18626 WillSupply
            transitions:
              success: CONDITION_PENDING
          - name: ask-retry
            desc: Ask requester to retry with new ISO18626 metadata
            transitions:
              success: COMPLETED_WITH_RETRY
        events:
          - name: cancel-request
            desc: Requester sent ISO18626 Cancel
            transition: CANCEL_REQUESTED

      - name: WILL_SUPPLY
        display: Will Supply
        desc: After manual will-supply or successful auto-responder
        side: SUPPLIER
        closingAction: cannot-supply
        actions:
          - name: add-item
            desc: Manually attach an item to the lending request
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: remove-item
            desc: Remove an attached item by barcode
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: add-condition
            desc: Add conditions and notify requester
            transitions:
              success: CONDITION_PENDING
          - name: ship
            desc: "Mark shipped; send ISO Loaned; NCIP CheckOutItem"
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
            primaryFor:
              serviceTypes: [Loan, CopyOrLoan]
            transitions:
              success: SHIPPED
          - name: supply-document
            desc: Attach the document URL and send ISO18626 CopyCompleted
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
            primaryFor:
              serviceTypes: [Copy]
            transitions:
              success: COMPLETED
          - name: cannot-supply
            desc: Indicate cannot supply
            transitions:
              success: UNFILLED
          - name: ask-retry
            desc: Ask requester to retry with new ISO18626 metadata
            transitions:
              success: COMPLETED_WITH_RETRY
        events:
          - name: cancel-request
            desc: Requester sends ISO Cancel
            transition: CANCEL_REQUESTED

      - name: CONDITION_PENDING
        display: Condition Pending
        desc: Conditions are sent with a special ISO WillSupply
        side: SUPPLIER
        primaryAction: cannot-supply
        closingAction: cannot-supply
        actions:
          - name: add-condition
            desc: Add additional conditions and notify requester
            transitions:
              success: CONDITION_PENDING
          - name: cannot-supply
            desc: Indicate cannot supply
            transitions:
              success: UNFILLED
        events:
          - name: conditions-accepted
            desc: Requester accepts conditions
            transition: CONDITION_ACCEPTED
          - name: condition-rejected
            desc: Requester rejects conditions
            transition: CANCEL_REQUESTED
          - name: cancel-request
            desc: Requester sends ISO Cancel
            transition: CANCEL_REQUESTED

      - name: CONDITION_ACCEPTED
        display: Condition Accepted
        desc: After receiving conditions accepted notification
        side: SUPPLIER
        closingAction: cannot-supply
        actions:
          - name: add-item
            desc: Manually attach an item to the lending request
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: remove-item
            desc: Remove an attached item by barcode
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
          - name: add-condition
            desc: Add additional conditions and notify requester
            transitions:
              success: CONDITION_PENDING
          - name: ship
            desc: "Mark shipped; send ISO Loaned; NCIP CheckOutItem"
            appliesTo:
              serviceTypes: [Loan, CopyOrLoan]
            primaryFor:
              serviceTypes: [Loan, CopyOrLoan]
            transitions:
              success: SHIPPED
          - name: supply-document
            desc: Attach the document URL and send ISO18626 CopyCompleted
            appliesTo:
              serviceTypes: [Copy, CopyOrLoan]
            primaryFor:
              serviceTypes: [Copy]
            transitions:
              success: COMPLETED
          - name: cannot-supply
            desc: Indicate cannot supply
            transitions:
              success: UNFILLED
        events:
          - name: cancel-request
            desc: Requester sends ISO Cancel
            transition: CANCEL_REQUESTED

      - name: SHIPPED
        display: Shipped
        desc: "After marking shipped and sending ISO Loaned; NCIP CheckOutItem"
        side: SUPPLIER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        events:
          - name: received
            desc: Requester sends ISO Received
            transition: RECEIVED

      - name: RECEIVED
        display: Received
        desc: Requester has received the shipped item
        side: SUPPLIER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        events:
          - name: shipped-return
            desc: Requester sends ISO ShippedReturn
            transition: SHIPPED_RETURN

      - name: SHIPPED_RETURN
        display: Shipped Return
        desc: After receiving ISO ShippedReturn message
        side: SUPPLIER
        appliesTo:
          serviceTypes: [Loan, CopyOrLoan]
        primaryAction: mark-received
        actions:
          - name: mark-received
            desc: "Mark returned item received and complete (CheckInItem if configured)"
            transitions:
              success: COMPLETED

      - name: CANCEL_REQUESTED
        display: Cancel Requested
        desc: After receiving ISO18626 Cancel from requester
        side: SUPPLIER
        needsAttention: true
        primaryAction: accept-cancel
        actions:
          - name: accept-cancel
            desc: Confirm cancellation
            transitions:
              success: CANCELLED
          - name: reject-cancel
            desc: Resume supplying despite cancel request
            transitions:
              success: WILL_SUPPLY

      - name: COMPLETED
        display: Completed
        desc: Loan return or document supply completed
        side: SUPPLIER
        terminal: true

      - name: CANCELLED
        display: Cancelled
        desc: After marking cancelled or automatically if auto-cancellation is on
        side: SUPPLIER
        terminal: true

      - name: UNFILLED
        display: Unfilled
        desc: After manual cannot-supply or automatically if auto-responder is on
        side: SUPPLIER
        terminal: true

      - name: COMPLETED_WITH_RETRY
        display: Completed with Retry
        desc: After sending retry to requester
        side: SUPPLIER
        terminal: true

      - name: MANUALLY_CLOSED
        display: Manually closed
        desc: Closed manually by staff
        side: SUPPLIER
        terminal: true
        manualClose: true

batchActionDefaults:
  - actionName: email-pullslips
    titleKey: email-pullslips
    title: Email pull slips ready to ship
    batchQuery: side = lending and state = WILL_SUPPLY
    schedule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;BYHOUR=6;BYMINUTE=0"
    actionParams:
      to:
        - staff@example.com
      templateLabel: pullslip-email
      includePdf: true

  - actionName: request-aging
    titleKey: request-aging-express
    title: Request aging of express requests
    batchQuery: "side = lending and (state = VALIDATED or state = WILL_SUPPLY or state = CONDITION_PENDING or state = CONDITION_ACCEPTED) and service_level = Express"
    schedule: "FREQ=MINUTELY;INTERVAL=15"
    actionParams:
      interval: 2h

  - actionName: request-aging
    titleKey: request-aging-rush
    title: Request aging of rush requests
    batchQuery: "side = lending and (state = VALIDATED or state = WILL_SUPPLY or state = CONDITION_PENDING or state = CONDITION_ACCEPTED) and service_level = Rush"
    schedule: "FREQ=HOURLY;BYMINUTE=0"
    actionParams:
      interval: 24h

  - actionName: request-aging
    titleKey: request-aging-all
    title: Request aging of all requests
    batchQuery: "side = lending and (state = VALIDATED or state = WILL_SUPPLY or state = CONDITION_PENDING or state = CONDITION_ACCEPTED)"
    schedule: "FREQ=DAILY;BYHOUR=5;BYMINUTE=0"
    actionParams:
      interval: 72h

templateDefaults:
  - title: Received item notification
    labels:
      - received-notification
    subject: "Your requested item is ready"
    contentType: text
    audience: patron
    purpose: email
    body: |
      Your requested item has been received and is ready for the next step.

  - title: Unfilled request notification
    labels:
      - unfilled-notification
    subject: "Your request could not be filled"
    contentType: text
    audience: patron
    purpose: email
    body: |
      We were unable to fill your request.

  - title: Cancelled request notification
    labels:
      - cancelled-notification
    subject: "Your request has been cancelled"
    contentType: text
    audience: patron
    purpose: email
    body: |
      Your request has been cancelled.

  - title: New supply request notification
    labels:
      - new-supply-request-notification
    subject: "New supply request received"
    contentType: text
    audience: staff
    purpose: email
    body: |
      A new supply request has been received and is ready for processing.

  - title: Scheduled pullslips email template
    labels:
      - pullslip-email
    subject: "Scheduled pullslips"
    contentType: html
    audience: staff
    purpose: email
    body: |
      <p>This is an automated pull slip summary.</p>
      <p>
        <strong>Query:</strong> {{batchQuery}}<br>
        <strong>Matching requests:</strong> {{actualCount}} (of {{fullCount}} total)
      </p>
      <p>Please process the attached pull slips at your earliest convenience.</p>
