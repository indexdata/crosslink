apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "..fullname" . }}-okapi-hooks-job
  labels:
    {{- include "..labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
spec:
  template:
    metadata:
      name: {{ include "..fullname" . }}-okapi-hooks-job
      labels:
        {{- include "..labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.okapiHooks.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: okapi-hooks
        image: "{{ .Values.okapiHooks.image.repository }}:{{ .Values.okapiHooks.image.tag }}"
        pullPolicy: {{ .Values.okapiHooks.image.pullPolicy }}
        env:
          - name: OKAPI_URL
            value: "http://okapi:9130"
          - name: MD_URL
            value: "http://{{ include "..fullname" . }}:{{ .Values.service.httpPort }}"
          {{- range $k, $v := .Values.okapiHooks.env }}
          - name: {{ $k }}
            value: "{{ $v }}"
          {{- end }}
          {{- range $k, $v := .Values.okapiHooks.envSecrets }}
          - name: {{ $k }}
            valueFrom:
              secretKeyRef:
                name: "{{ $v.name }}"
                key: "{{ $v.key }}"
          {{- end }}
          - name: OKAPI_MD
            valueFrom:
              configMapKeyRef:
                name: {{ include "..fullname" . }}-md
                key: ModuleDescriptor
          {{- range $k, $v := .Values.okapiHooks.envConfigMaps }}
          - name: {{ $k }}
            valueFrom:
              configMapKeyRef:
                name: "{{ $v.name }}"
                key: "{{ $v.key }}"
          {{- end }}
