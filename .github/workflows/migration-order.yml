name: migration-order

# Fails when a new database migration is numbered at or below one already on
# main, or when two migrations share a version: golang-migrate silently skips
# such a migration on databases past that version. See
# .github/scripts/check-migration-order.sh.
#
# There is deliberately no paths filter: the job must report on every pull
# request so branch protection can require it.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  migration-order:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check migration order
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # A pull request checks out its merge commit, whose first parent is the
          # main commit it was merged with. A push must compare with the previous
          # tip of main; refuse to use rewritten history if that tip is missing.
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              echo "::error::Cannot resolve pre-push commit $PUSH_BEFORE; refusing to substitute another migration baseline."
              exit 1
            fi
            base=$PUSH_BEFORE
          fi
          .github/scripts/check-migration-order.sh "$base"
