# Standalone workflow for Bruno end-to-end tests.
name: bruno-e2e

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '**/README.md'

jobs:
  bruno:
    name: Bruno E2E (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: mock
            compose_files: -f bruno/docker-compose.yml
          - directory: real
            compose_files: -f bruno/docker-compose.yml -f bruno/docker-compose-directory.yml
    env:
      COMPOSE_FILE_ARGS: ${{ matrix.compose_files }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Load tool versions
      run: cat .github/tool-versions.env >> "$GITHUB_ENV"

    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: xsltproc
        version: 1.0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: |
          go.work.sum
          broker/go.sum
          directory/go.sum
          illmock/go.sum

    - name: Generate sources
      run: make generate

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Test Directory seeder
      if: matrix.directory == 'real'
      run: python3 -B -m unittest -v bruno/test_seed_directory.py

    - name: Validate Compose configuration
      run: docker compose $COMPOSE_FILE_ARGS config -q

    - name: Start Crosslink stack
      run: docker compose $COMPOSE_FILE_ARGS up -d --build

    - name: Check Directory seed result
      if: matrix.directory == 'real'
      run: |
        seed_container=$(docker compose $COMPOSE_FILE_ARGS ps -aq directory-seed)
        test -n "$seed_container"
        test "$(docker inspect --format '{{.State.Status}}' "$seed_container")" = exited
        test "$(docker inspect --format '{{.State.ExitCode}}' "$seed_container")" -eq 0

    - name: Wait for broker readiness
      run: |
        for i in {1..60}; do
          if curl -sSf -o /dev/null http://localhost:8080/healthz; then
            exit 0
          fi
          sleep 2
        done
        echo "Broker did not become ready in time"
        docker compose $COMPOSE_FILE_ARGS ps
        docker compose $COMPOSE_FILE_ARGS logs --no-color
        exit 1

    - name: Run Bruno collection (headless)
      working-directory: bruno/crosslink
      run: |
        npx --yes @usebruno/cli@3.5.2 run \
          --env LocalDev \
          --env-var userPassword="dummy"

    - name: Print container logs on failure
      if: failure()
      run: docker compose $COMPOSE_FILE_ARGS logs --no-color

    - name: Stop Crosslink stack
      if: always()
      run: docker compose $COMPOSE_FILE_ARGS down -v --remove-orphans
