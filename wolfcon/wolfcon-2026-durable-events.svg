<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#007693"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f78b1e"/>
    </marker>
    <style>
      .heading { font: 700 29px Arial, sans-serif; fill: #002f56; }
      .body { font: 23px Arial, sans-serif; fill: #454545; }
      .small { font: 21px Arial, sans-serif; fill: #454545; }
      .edge { font: 700 20px Arial, sans-serif; fill: #007693; }
      .signal { font: 700 20px Arial, sans-serif; fill: #c5680b; }
    </style>
  </defs>

  <rect width="1600" height="500" fill="#ffffff"/>

  <rect x="35" y="155" width="290" height="190" rx="28" fill="#eaf0fb" stroke="#3e75cf" stroke-width="5"/>
  <circle cx="125" cy="215" r="26" fill="none" stroke="#3e75cf" stroke-width="5"/>
  <path d="M175 215 H245 M224 194 L245 215 L224 236" fill="none" stroke="#3e75cf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="285" text-anchor="middle" class="heading">USER ACTION</text>
  <text x="180" y="321" text-anchor="middle" class="body">or ISO message</text>

  <line x1="325" y1="250" x2="430" y2="250" stroke="#007693" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="377" y="222" text-anchor="middle" class="edge">commit</text>

  <rect x="455" y="125" width="330" height="250" rx="28" fill="#fff4e7" stroke="#f78b1e" stroke-width="5"/>
  <ellipse cx="620" cy="180" rx="72" ry="25" fill="#ffffff" stroke="#f78b1e" stroke-width="5"/>
  <path d="M548 180 V245 C548 259,580 270,620 270 C660 270,692 259,692 245 V180" fill="#ffffff" stroke="#f78b1e" stroke-width="5"/>
  <path d="M548 213 C548 227,580 238,620 238 C660 238,692 227,692 213" fill="none" stroke="#f78b1e" stroke-width="4"/>
  <text x="620" y="315" text-anchor="middle" class="heading">DURABLE EVENT</text>
  <text x="620" y="350" text-anchor="middle" class="body">row in PostgreSQL</text>

  <line x1="785" y1="285" x2="908" y2="285" stroke="#007693" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="846" y="365" text-anchor="middle" class="edge">claim row</text>

  <path d="M785 205 C825 105,875 105,915 205" fill="none" stroke="#f78b1e" stroke-width="5" stroke-dasharray="11 10" marker-end="url(#arrow-orange)"/>
  <text x="850" y="54" text-anchor="middle" class="signal">LISTEN / NOTIFY</text>
  <text x="850" y="84" text-anchor="middle" class="small">wake-up signal only</text>

  <rect x="958" y="148" width="300" height="220" rx="26" fill="#f3f8eb" stroke="#69a33f" stroke-width="4" opacity="0.55"/>
  <rect x="942" y="134" width="300" height="220" rx="26" fill="#f3f8eb" stroke="#69a33f" stroke-width="4" opacity="0.75"/>
  <rect x="925" y="120" width="300" height="220" rx="26" fill="#f3f8eb" stroke="#69a33f" stroke-width="5"/>
  <circle cx="1002" cy="194" r="29" fill="#ffffff" stroke="#69a33f" stroke-width="5"/>
  <path d="M1002 155 V168 M1002 220 V233 M963 194 H976 M1028 194 H1041 M975 167 L984 176 M1020 212 L1029 221 M975 221 L984 212 M1020 176 L1029 167" fill="none" stroke="#69a33f" stroke-width="5" stroke-linecap="round"/>
  <text x="1075" y="250" text-anchor="middle" class="heading">BROKER WORKERS</text>
  <text x="1075" y="286" text-anchor="middle" class="body">one instance claims</text>
  <text x="1075" y="318" text-anchor="middle" class="body">and processes the event</text>

  <line x1="1245" y1="250" x2="1325" y2="250" stroke="#007693" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <text x="1285" y="221" text-anchor="middle" class="edge">commit</text>

  <rect x="1350" y="110" width="220" height="275" rx="28" fill="#e8f2f7" stroke="#002f56" stroke-width="5"/>
  <path d="M1400 187 L1421 208 L1458 166" fill="none" stroke="#007693" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1480" y1="178" x2="1530" y2="178" stroke="#002f56" stroke-width="5" stroke-linecap="round"/>
  <line x1="1400" y1="239" x2="1530" y2="239" stroke="#002f56" stroke-width="5" stroke-linecap="round"/>
  <line x1="1400" y1="274" x2="1530" y2="274" stroke="#002f56" stroke-width="5" stroke-linecap="round"/>
  <text x="1460" y="303" text-anchor="middle" class="heading">RECORDED</text>
  <text x="1460" y="338" text-anchor="middle" class="small">result · next state</text>
  <text x="1460" y="368" text-anchor="middle" class="small">history</text>

  <text x="800" y="455" text-anchor="middle" class="body">The database row is the work; the notification only reduces latency.</text>
</svg>
