<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#007693"/>
    </marker>
    <style>
      .title { font: 700 35px Arial, sans-serif; fill: #002f56; }
      .label { font: 700 27px Arial, sans-serif; fill: #002f56; }
      .body { font: 24px Arial, sans-serif; fill: #454545; }
      .small { font: 21px Arial, sans-serif; fill: #454545; }
    </style>
  </defs>
  <rect width="1600" height="720" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title">A small grammar for a complete workflow</text>

  <rect x="55" y="235" width="315" height="180" rx="28" fill="#e8f2f7" stroke="#002f56" stroke-width="5"/>
  <text x="212" y="305" text-anchor="middle" class="label">CURRENT STATE</text>
  <text x="212" y="350" text-anchor="middle" class="body">What is true now?</text>

  <line x1="370" y1="325" x2="600" y2="325" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="410" y="165" width="205" height="80" rx="18" fill="#fff4e7" stroke="#f78b1e" stroke-width="4"/>
  <text x="512" y="215" text-anchor="middle" class="label">ACTION</text>
  <text x="487" y="385" text-anchor="middle" class="small">manual or automatic</text>

  <rect x="630" y="235" width="315" height="180" rx="28" fill="#f6e8f2" stroke="#b31782" stroke-width="5"/>
  <text x="787" y="305" text-anchor="middle" class="label">OUTCOME</text>
  <text x="787" y="350" text-anchor="middle" class="body">success · review · failure</text>

  <line x1="945" y1="325" x2="1175" y2="325" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="985" y="165" width="205" height="80" rx="18" fill="#eaf0fb" stroke="#3e75cf" stroke-width="4"/>
  <text x="1087" y="215" text-anchor="middle" class="label">TRANSITION</text>

  <rect x="1205" y="235" width="315" height="180" rx="28" fill="#e8f2f7" stroke="#002f56" stroke-width="5"/>
  <text x="1362" y="305" text-anchor="middle" class="label">NEXT STATE</text>
  <text x="1362" y="350" text-anchor="middle" class="body">The new truth</text>

  <path d="M212 415 C212 590, 1362 590, 1362 415" fill="none" stroke="#b31782" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <rect x="625" y="505" width="350" height="78" rx="18" fill="#ffffff" stroke="#b31782" stroke-width="4"/>
  <text x="800" y="555" text-anchor="middle" class="label">INCOMING EVENT</text>
  <text x="800" y="640" text-anchor="middle" class="small">External messages use the same permitted transitions</text>
</svg>
