<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#007693"/></marker>
    <style>
      .state { font: 700 22px Arial, sans-serif; fill: #002f56; }
      .branch { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .note { font: 22px Arial, sans-serif; fill: #454545; }
      .phase { font: 700 25px Arial, sans-serif; fill: #007693; }
    </style>
  </defs>
  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="180" y="85" class="phase">PREPARE</text>
  <text x="665" y="85" class="phase">SOURCE</text>
  <text x="1125" y="85" class="phase">FULFIL</text>
  <text x="1540" y="85" class="phase">RETURN</text>
  <line x1="55" y1="105" x2="1745" y2="105" stroke="#199dd9" stroke-width="5"/>

  <g fill="#e8f2f7" stroke="#002f56" stroke-width="4">
    <rect x="35" y="250" width="175" height="90" rx="18"/><rect x="250" y="250" width="175" height="90" rx="18"/>
    <rect x="465" y="250" width="210" height="90" rx="18"/><rect x="715" y="250" width="175" height="90" rx="18"/>
    <rect x="930" y="250" width="210" height="90" rx="18"/><rect x="1180" y="250" width="175" height="90" rx="18"/>
    <rect x="1395" y="250" width="175" height="90" rx="18"/><rect x="1610" y="250" width="155" height="90" rx="18"/>
  </g>
  <g class="state" text-anchor="middle">
    <text x="122" y="305">NEW</text><text x="337" y="305">VALIDATED</text>
    <text x="570" y="293">READY TO</text><text x="570" y="319">SEND</text>
    <text x="802" y="305">SENT</text><text x="1035" y="293">SUPPLIER</text><text x="1035" y="319">LOCATED</text>
    <text x="1267" y="293">WILL</text><text x="1267" y="319">SUPPLY</text>
    <text x="1482" y="305">SHIPPED</text><text x="1687" y="293">RECEIVED /</text><text x="1687" y="319">COMPLETE</text>
  </g>
  <g stroke="#007693" stroke-width="5" marker-end="url(#arr)">
    <line x1="210" y1="295" x2="242" y2="295"/><line x1="425" y1="295" x2="457" y2="295"/>
    <line x1="675" y1="295" x2="707" y2="295"/><line x1="890" y1="295" x2="922" y2="295"/>
    <line x1="1140" y1="295" x2="1172" y2="295"/><line x1="1355" y1="295" x2="1387" y2="295"/>
    <line x1="1570" y1="295" x2="1602" y2="295"/>
  </g>

  <g>
    <rect x="95" y="510" width="285" height="86" rx="18" fill="#b31782"/>
    <text x="237" y="562" class="branch" text-anchor="middle">INVALID PATRON</text>
    <path d="M122 340 C122 420,237 420,237 500" fill="none" stroke="#b31782" stroke-width="5" marker-end="url(#arr)"/>
    <text x="237" y="635" class="note" text-anchor="middle">Pause for staff review</text>

    <rect x="890" y="510" width="290" height="86" rx="18" fill="#f78b1e"/>
    <text x="1035" y="562" class="branch" text-anchor="middle">UNFILLED</text>
    <path d="M1035 340 L1035 500" fill="none" stroke="#f78b1e" stroke-width="5" marker-end="url(#arr)"/>
    <text x="1035" y="635" class="note" text-anchor="middle">Try the next supplier</text>

    <rect x="1210" y="510" width="330" height="86" rx="18" fill="#3e75cf"/>
    <text x="1375" y="562" class="branch" text-anchor="middle">CONDITION PENDING</text>
    <path d="M1267 340 C1267 430,1375 430,1375 500" fill="none" stroke="#3e75cf" stroke-width="5" marker-end="url(#arr)"/>
    <text x="1375" y="635" class="note" text-anchor="middle">Accept or reject terms</text>
  </g>
  <text x="900" y="790" class="note" text-anchor="middle">The happy path is simple. The model makes exceptions explicit.</text>
</svg>
