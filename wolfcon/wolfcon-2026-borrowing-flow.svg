<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#007693"/></marker>
    <marker id="mainArr" markerWidth="34" markerHeight="34" refX="33" refY="17" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L34,17 L0,34 Z" fill="#007693"/></marker>
    <style>
      .state { font: 700 22px Arial, sans-serif; fill: #002f56; }
      .branch { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .note { font: 22px Arial, sans-serif; fill: #454545; }
      .phase { font: 700 25px Arial, sans-serif; fill: #007693; }
    </style>
  </defs>
  <rect width="1800" height="900" fill="#ffffff"/>
  <text x="240" y="85" class="phase">PREPARE</text>
  <text x="790" y="85" class="phase">SOURCE</text>
  <text x="1160" y="85" class="phase">FULFIL</text>
  <text x="1540" y="85" class="phase">RETURN</text>
  <line x1="55" y1="105" x2="1745" y2="105" stroke="#199dd9" stroke-width="5"/>

  <g fill="#e8f2f7" stroke="#002f56" stroke-width="4">
    <rect x="25" y="250" width="135" height="90" rx="18"/><rect x="180" y="250" width="150" height="90" rx="18"/>
    <rect x="350" y="250" width="190" height="90" rx="18"/><rect x="560" y="250" width="175" height="90" rx="18"/>
    <rect x="755" y="250" width="130" height="90" rx="18"/><rect x="905" y="250" width="180" height="90" rx="18"/>
    <rect x="1105" y="250" width="150" height="90" rx="18"/><rect x="1275" y="250" width="140" height="90" rx="18"/>
    <rect x="1435" y="250" width="150" height="90" rx="18"/><rect x="1605" y="250" width="155" height="90" rx="18"/>
  </g>
  <g class="state" text-anchor="middle">
    <text x="92" y="305">NEW</text><text x="255" y="305">VALIDATED</text>
    <text x="445" y="293">METADATA</text><text x="445" y="319">UPDATED</text>
    <text x="647" y="293">READY TO</text><text x="647" y="319">SEND</text>
    <text x="820" y="305">SENT</text><text x="995" y="293">SUPPLIER</text><text x="995" y="319">LOCATED</text>
    <text x="1180" y="293">WILL</text><text x="1180" y="319">SUPPLY</text>
    <text x="1345" y="305">SHIPPED</text><text x="1510" y="305">RECEIVED</text><text x="1682" y="305">RETURNED</text>
  </g>
  <g stroke="#007693" stroke-width="5" marker-end="url(#mainArr)">
    <line x1="160" y1="295" x2="180" y2="295"/><line x1="330" y1="295" x2="350" y2="295"/>
    <line x1="540" y1="295" x2="560" y2="295"/><line x1="735" y1="295" x2="755" y2="295"/>
    <line x1="885" y1="295" x2="905" y2="295"/><line x1="1085" y1="295" x2="1105" y2="295"/>
    <line x1="1255" y1="295" x2="1275" y2="295"/><line x1="1415" y1="295" x2="1435" y2="295"/>
    <line x1="1585" y1="295" x2="1605" y2="295"/>
  </g>

  <g>
    <rect x="35" y="510" width="280" height="86" rx="18" fill="#b31782"/>
    <text x="175" y="562" class="branch" text-anchor="middle">INVALID PATRON</text>
    <path d="M92 340 C92 410,175 410,175 440 L175 500" fill="none" stroke="#b31782" stroke-width="5" marker-end="url(#arr)"/>
    <text x="175" y="635" class="note" text-anchor="middle">Pause for staff review</text>

    <rect x="335" y="510" width="290" height="86" rx="18" fill="#f78b1e"/>
    <text x="480" y="562" class="branch" text-anchor="middle">NEEDS REVIEW</text>
    <path d="M445 340 C445 410,480 410,480 440 L480 500" fill="none" stroke="#f78b1e" stroke-width="5" marker-end="url(#arr)"/>
    <text x="480" y="635" class="note" text-anchor="middle">Review before sending</text>

    <rect x="675" y="510" width="290" height="86" rx="18" fill="#007693"/>
    <text x="820" y="562" class="branch" text-anchor="middle">TRANSACTION FLOW</text>
    <path d="M820 340 L820 500" fill="none" stroke="#007693" stroke-width="5" marker-end="url(#arr)"/>
    <text x="820" y="635" class="note" text-anchor="middle">Broker routing and retries</text>

    <rect x="1210" y="510" width="330" height="86" rx="18" fill="#3e75cf"/>
    <text x="1375" y="562" class="branch" text-anchor="middle">CONDITION PENDING</text>
    <path d="M1180 340 C1180 420,1375 420,1375 440 L1375 500" fill="none" stroke="#3e75cf" stroke-width="5" marker-end="url(#arr)"/>
    <text x="1375" y="635" class="note" text-anchor="middle">Accept or reject terms</text>
  </g>
  <text x="900" y="790" class="note" text-anchor="middle">The happy path is simple. The model makes exceptions explicit.</text>
</svg>
