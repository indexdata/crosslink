<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
  <defs>
    <marker id="arrow" markerWidth="24" markerHeight="24" refX="23" refY="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L24,12 L0,24 Z" fill="#007693"/>
    </marker>
    <style>
      .heading { font: 700 28px Arial, sans-serif; fill: #002f56; }
      .apiheading { font: 700 26px Arial, sans-serif; fill: #002f56; }
      .body { font: 22px Arial, sans-serif; fill: #454545; }
      .small { font: 20px Arial, sans-serif; fill: #454545; }
      .edge { font: 700 19px Arial, sans-serif; fill: #007693; }
      .code { font: 700 22px Menlo, Consolas, monospace; fill: #002f56; }
    </style>
  </defs>

  <rect width="1600" height="520" fill="#ffffff"/>

  <!-- Declarative source -->
  <rect x="35" y="145" width="280" height="225" rx="28" fill="#fff4e7" stroke="#f78b1e" stroke-width="5"/>
  <path d="M105 188 H230 V255 H105 Z M205 188 V213 H230" fill="#ffffff" stroke="#f78b1e" stroke-width="5" stroke-linejoin="round"/>
  <line x1="130" y1="222" x2="185" y2="222" stroke="#f78b1e" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="241" x2="200" y2="241" stroke="#f78b1e" stroke-width="4" stroke-linecap="round"/>
  <text x="175" y="299" text-anchor="middle" class="heading">YAML MODEL</text>
  <text x="175" y="334" text-anchor="middle" class="small">validated for Loan · Copy</text>
  <text x="175" y="360" text-anchor="middle" class="small">· CopyOrLoan</text>

  <line x1="315" y1="258" x2="410" y2="258" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="350" y="230" text-anchor="middle" class="edge">load</text>

  <!-- Runtime action mapping -->
  <rect x="410" y="120" width="330" height="275" rx="28" fill="#f6e8f2" stroke="#b31782" stroke-width="5"/>
  <circle cx="575" cy="190" r="33" fill="#ffffff" stroke="#b31782" stroke-width="5"/>
  <path d="M575 168 V190 L595 204" fill="none" stroke="#b31782" stroke-width="5" stroke-linecap="round"/>
  <text x="575" y="252" text-anchor="middle" class="heading">CURRENT STATE</text>
  <text x="575" y="291" text-anchor="middle" class="body">allowed actions</text>
  <text x="575" y="323" text-anchor="middle" class="body">parameters · outcomes</text>
  <text x="575" y="355" text-anchor="middle" class="body">manual · automatic</text>

  <!-- Mapping to GET path -->
  <path d="M740 195 C770 195,785 152,820 152" fill="none" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="772" y="128" text-anchor="middle" class="edge">publish</text>

  <!-- GET available actions -->
  <rect x="820" y="65" width="310" height="175" rx="25" fill="#f3f8eb" stroke="#69a33f" stroke-width="5"/>
  <text x="975" y="124" text-anchor="middle" class="code">GET</text>
  <text x="975" y="158" text-anchor="middle" class="apiheading">AVAILABLE ACTIONS</text>
  <text x="975" y="194" text-anchor="middle" class="small">choices · parameters</text>
  <text x="975" y="220" text-anchor="middle" class="small">availability · primary</text>

  <line x1="1130" y1="152" x2="1225" y2="152" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- UI -->
  <rect x="1225" y="65" width="340" height="175" rx="25" fill="#eaf0fb" stroke="#3e75cf" stroke-width="5"/>
  <rect x="1280" y="105" width="110" height="78" rx="8" fill="#ffffff" stroke="#3e75cf" stroke-width="5"/>
  <line x1="1300" y1="129" x2="1370" y2="129" stroke="#3e75cf" stroke-width="4" stroke-linecap="round"/>
  <line x1="1300" y1="153" x2="1350" y2="153" stroke="#3e75cf" stroke-width="4" stroke-linecap="round"/>
  <text x="1460" y="135" text-anchor="middle" class="heading">STAFF UI</text>
  <text x="1460" y="171" text-anchor="middle" class="body">renders only</text>
  <text x="1460" y="201" text-anchor="middle" class="body">valid choices</text>

  <!-- UI selection to POST -->
  <line x1="1395" y1="240" x2="1395" y2="310" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1425" y="270" class="edge">select</text>

  <!-- POST selected action -->
  <rect x="1225" y="310" width="340" height="145" rx="25" fill="#f3f8eb" stroke="#69a33f" stroke-width="5"/>
  <text x="1395" y="365" text-anchor="middle" class="code">POST</text>
  <text x="1395" y="405" text-anchor="middle" class="heading">SELECTED ACTION</text>
  <text x="1395" y="435" text-anchor="middle" class="small">with parameters</text>

  <!-- POST to backend -->
  <line x1="1225" y1="382" x2="1120" y2="382" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>

  <!-- Mapping also feeds enforcement -->
  <path d="M740 330 C785 330,800 382,845 382" fill="none" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="793" y="325" text-anchor="middle" class="edge">same rules</text>

  <!-- Backend enforcement -->
  <rect x="845" y="295" width="275" height="175" rx="25" fill="#e8f2f7" stroke="#002f56" stroke-width="5"/>
  <path d="M880 348 L897 365 L925 333" fill="none" stroke="#007693" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1010" y="354" text-anchor="middle" class="heading">BACKEND</text>
  <text x="982" y="397" text-anchor="middle" class="body">validates · executes</text>
  <text x="982" y="430" text-anchor="middle" class="body">transitions</text>

  <!-- Next-state feedback -->
  <path d="M845 444 C785 500,575 505,575 395" fill="none" stroke="#007693" stroke-width="5" stroke-dasharray="11 10" marker-end="url(#arrow)"/>
  <text x="710" y="510" text-anchor="middle" class="edge">next state refreshes the mapping</text>
</svg>
