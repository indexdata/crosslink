<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720">
  <defs>
    <marker id="arrow" markerWidth="32" markerHeight="32" refX="31" refY="16" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L32,16 L0,32 Z" fill="#007693"/></marker>
    <marker id="loopArrow" markerWidth="28" markerHeight="28" refX="27" refY="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L28,14 L0,28 Z" fill="#b31782"/></marker>
    <style>
      .head { font: 700 27px Arial, sans-serif; fill: #002f56; }
      .body { font: 21px Arial, sans-serif; fill: #454545; }
      .small { font: 19px Arial, sans-serif; fill: #454545; }
      .decision { font: 700 24px Arial, sans-serif; fill: #ffffff; }
      .edge { font: 700 19px Arial, sans-serif; fill: #007693; }
      .loop { font: 700 19px Arial, sans-serif; fill: #b31782; }
      .footer { font: 700 24px Arial, sans-serif; fill: #007693; }
    </style>
  </defs>
  <rect width="1800" height="720" fill="#ffffff"/>
  <g>
    <rect x="40" y="95" width="250" height="160" rx="24" fill="#eaf0fb" stroke="#3e75cf" stroke-width="5"/>
    <circle cx="165" cy="137" r="23" fill="#ffffff" stroke="#3e75cf" stroke-width="4"/>
    <path d="M128 193 C136 163,194 163,202 193" fill="none" stroke="#3e75cf" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="218" text-anchor="middle" class="head">SELECT COHORT</text>
    <text x="165" y="245" text-anchor="middle" class="small">representative institutions</text>
  </g>
  <line x1="290" y1="175" x2="340" y2="175" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <g>
    <rect x="340" y="95" width="320" height="160" rx="24" fill="#fff4e7" stroke="#f78b1e" stroke-width="5"/>
    <path d="M463 128 H537 V176 H463 Z M480 176 V190 H520 V176" fill="#ffffff" stroke="#f78b1e" stroke-width="4" stroke-linejoin="round"/>
    <text x="500" y="218" text-anchor="middle" class="head">REHEARSAL ENV</text>
    <text x="500" y="245" text-anchor="middle" class="small">real data · isolated effects</text>
  </g>
  <line x1="660" y1="175" x2="720" y2="175" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <g>
    <rect x="720" y="95" width="300" height="160" rx="24" fill="#e8f2f7" stroke="#007693" stroke-width="5"/>
    <path d="M870 125 V174 M848 153 L870 175 L892 153" fill="none" stroke="#007693" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="870" y="218" text-anchor="middle" class="head">IMPORT SNAPSHOT</text>
    <text x="870" y="245" text-anchor="middle" class="small">open + recently created requests</text>
  </g>
  <line x1="1020" y1="175" x2="1080" y2="175" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <g>
    <rect x="1080" y="95" width="290" height="160" rx="24" fill="#f6e8f2" stroke="#b31782" stroke-width="5"/>
    <path d="M1187 127 H1263 V180 H1187 Z" fill="#ffffff" stroke="#b31782" stroke-width="4"/>
    <path d="M1203 146 H1247 M1203 162 H1235" stroke="#b31782" stroke-width="4" stroke-linecap="round"/>
    <text x="1225" y="218" text-anchor="middle" class="head">STAFF REVIEW</text>
    <text x="1225" y="245" text-anchor="middle" class="small">states · actions · searches</text>
  </g>
  <line x1="1370" y1="175" x2="1450" y2="175" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <polygon points="1580,75 1710,175 1580,275 1450,175" fill="#007693" stroke="#005d76" stroke-width="5"/>
  <text x="1580" y="184" text-anchor="middle" class="decision">READY?</text>
  <path d="M1515 225 L1260 390" fill="none" stroke="#b31782" stroke-width="5" marker-end="url(#loopArrow)"/>
  <text x="1350" y="285" text-anchor="middle" class="loop">NOT YET</text>
  <g>
    <rect x="1040" y="390" width="330" height="130" rx="23" fill="#fff0f8" stroke="#b31782" stroke-width="5"/>
    <text x="1205" y="445" text-anchor="middle" class="head">FIX AND REPEAT</text>
    <text x="1205" y="480" text-anchor="middle" class="body">mapping · importer · configuration</text>
  </g>
  <path d="M1040 455 L870 255" fill="none" stroke="#b31782" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#loopArrow)"/>
  <line x1="1580" y1="275" x2="1580" y2="380" stroke="#007693" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="1610" y="335" class="edge">YES</text>
  <g>
    <rect x="1430" y="380" width="300" height="150" rx="23" fill="#f3f8eb" stroke="#69a33f" stroke-width="5"/>
    <path d="M1558 414 L1574 430 L1601 402" fill="none" stroke="#69a33f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1580" y="468" text-anchor="middle" class="head">READY FOR</text>
    <text x="1580" y="500" text-anchor="middle" style="font:700 22px Arial,sans-serif;fill:#002f56">MAINTENANCE WINDOW</text>
  </g>
  <text x="900" y="650" text-anchor="middle" class="footer">Every cycle starts from a clean import—not hand-repaired data.</text>
</svg>
